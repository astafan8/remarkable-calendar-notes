name: Release

# Cross-builds the armv7 (reMarkable 2) release binary inside the same
# container image the toltec/vellum ecosystem uses for its own packages,
# assembles an AppLoad bundle zip + checksums, and publishes them as
# GitHub Release assets.
#
# This workflow does NOT publish to Vellum. Vellum requires a maintainer
# to review and merge a PR against vellum-dev/vellum before anything is
# published to their (also maintainer-controlled) testing repository —
# see scripts/publish-vellum-testing.sh and vellum/packages/*/VELBUILD's
# `source=` URLs, which point at exactly the assets this workflow produces.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-armv7:
    name: Build armv7 release binary
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/toltec-dev/rust:v4.0
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends qtbase5-dev-tools zip

      - name: Cross-build for armv7 (reMarkable 2)
        shell: bash
        run: |
          set -euo pipefail
          . /opt/x-tools/switch-arm.sh
          export CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER="${CROSS_COMPILE}gcc"
          cargo build --release -p calnotes-app --target "$CARGO_BUILD_TARGET"
          "${CROSS_COMPILE}strip" "target/$CARGO_BUILD_TARGET/release/remarkable-calendar-notes"
          mkdir -p dist/stage/remarkable-calendar-notes
          cp "target/$CARGO_BUILD_TARGET/release/remarkable-calendar-notes" dist/stage/remarkable-calendar-notes/
          cp assets/icon.png dist/stage/remarkable-calendar-notes/
          cp external.manifest.json dist/stage/remarkable-calendar-notes/
          chmod 755 dist/stage/remarkable-calendar-notes/remarkable-calendar-notes
          mkdir -p dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/appload
          mkdir -p dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/qt-resource-rebuilder
          cp -a dist/stage/remarkable-calendar-notes \
            dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/appload/
          cp sidebar/3.27/calendarNotesSidebar.qmd \
            dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/qt-resource-rebuilder/
          /usr/lib/qt5/bin/rcc --binary \
            -o dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/qt-resource-rebuilder/calendarNotesSidebar.rcc \
            sidebar/3.27/calendarNotesSidebar.qrc
          cp dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/qt-resource-rebuilder/calendarNotesSidebar.rcc \
            dist/calendarNotesSidebar-3.27.rcc
          cp sidebar/README.md \
            dist/stage-sidebar/remarkable-calendar-notes-xovi-sidebar/
          mkdir -p dist/stage-diagnostics/remarkable-calendar-notes-diagnostics
          cp scripts/collect-device-log.ps1 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/collect-device-log.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/device-diagnostics-remote.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/install-device.ps1 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/install-device.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp docs/DIAGNOSTICS.md \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/README.md
          chmod 755 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/collect-device-log.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/device-diagnostics-remote.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/install-device.sh

      - name: Package AppLoad bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          out="dist/remarkable-calendar-notes-${version}-armv7.zip"
          (cd dist/stage && zip -r -X "../../$out" remarkable-calendar-notes)
          sha256sum "$out" > "$out.sha256"
          sha512sum "$out" > "$out.sha512"
          sidebar_out="dist/remarkable-calendar-notes-${version}-xovi-sidebar.zip"
          (cd dist/stage-sidebar && zip -r -X "../../$sidebar_out" remarkable-calendar-notes-xovi-sidebar)
          sha256sum "$sidebar_out" > "$sidebar_out.sha256"
          sha512sum "$sidebar_out" > "$sidebar_out.sha512"
          diagnostics_out="dist/remarkable-calendar-notes-${version}-diagnostics.zip"
          (cd dist/stage-diagnostics && zip -r -X "../../$diagnostics_out" remarkable-calendar-notes-diagnostics)
          sha256sum "$diagnostics_out" > "$diagnostics_out.sha256"
          sha512sum "$diagnostics_out" > "$diagnostics_out.sha512"
          sha256sum dist/calendarNotesSidebar-3.27.rcc \
            > dist/calendarNotesSidebar-3.27.rcc.sha256
          sha512sum dist/calendarNotesSidebar-3.27.rcc \
            > dist/calendarNotesSidebar-3.27.rcc.sha512

      - uses: actions/upload-artifact@v7
        with:
          name: remarkable-calendar-notes-armv7
          path: |
            dist/*.zip
            dist/*.rcc
            dist/*.sha256
            dist/*.sha512

  publish-release:
    name: Publish GitHub Release
    needs: build-armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: remarkable-calendar-notes-armv7
          path: dist

      - name: Create/update GitHub Release with bundle + checksums
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.rcc
            dist/*.sha256
            dist/*.sha512
          generate_release_notes: true
          body: |
            Automated reMarkable 2 builds:

            - `*-armv7.zip`: standard AppLoad application.
            - `*-xovi-sidebar.zip`: the same app plus an optional,
              firmware-pinned OS 3.27 xochitl sidebar launcher.
            - `*-diagnostics.zip`: one-password host-side installers and
              log collectors for Windows, Linux, and macOS. Run these on
              the computer connected to the tablet.

            **Vellum**: this release is not automatically published to
            Vellum. See `scripts/publish-vellum-testing.sh` and
            `docs/DEVELOPMENT.md` for the maintainer-reviewed process to
            propose it to vellum-dev/vellum.
