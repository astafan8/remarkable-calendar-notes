name: Release

# Cross-builds the armv7 (reMarkable 2) release binary inside the same
# container image the toltec/vellum ecosystem uses for its own packages,
# assembles an AppLoad bundle zip + checksums, and publishes them as
# GitHub Release assets.
#
# This workflow does NOT publish to Vellum. Vellum requires a maintainer
# to review and merge a PR against vellum-dev/vellum before anything is
# published to their (also maintainer-controlled) testing repository —
# see scripts/publish-vellum-testing.sh and vellum/packages/*/VELBUILD's
# `source=` URLs, which point at exactly the assets this workflow produces.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-armv7:
    name: Build armv7 release binary
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install target, cross, and packaging tools
        run: |
          rustup target add armv7-unknown-linux-musleabihf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev-tools zip qemu-user file
          cargo install cross --locked --version 0.2.5

      - name: Cross-build a fully static armv7 binary (reMarkable 2)
        shell: bash
        run: |
          set -euo pipefail
          target=armv7-unknown-linux-musleabihf
          # A static musl binary has no dependency on the device's glibc or
          # dynamic loader, so it runs regardless of firmware changes.
          cross build --release -p calnotes-app --target "$target"
          bin="target/$target/release/remarkable-calendar-notes"
          file "$bin"
          file "$bin" | grep -q "statically linked" \
            || { echo "ERROR: release binary is not statically linked" >&2; exit 1; }
          # Prove it actually starts on an ARM emulator (no sysroot needed
          # precisely because it is static) before we ship it.
          qemu-arm "$bin" --help >/dev/null
          mkdir -p dist/stage/remarkable-calendar-notes
          cp "$bin" dist/stage/remarkable-calendar-notes/
          cp assets/icon.png dist/stage/remarkable-calendar-notes/
          cp external.manifest.json dist/stage/remarkable-calendar-notes/
          chmod 755 dist/stage/remarkable-calendar-notes/remarkable-calendar-notes
          # The sidebar icon resource is compiled here but shipped only
          # inside the single all-in-one archive (dist/build is not
          # uploaded on its own).
          mkdir -p dist/build
          /usr/lib/qt5/bin/rcc --binary \
            -o dist/build/calendarNotesSidebar.rcc \
            sidebar/3.27/calendarNotesSidebar.qrc
          mkdir -p dist/stage-diagnostics/remarkable-calendar-notes-diagnostics
          cp scripts/collect-device-log.ps1 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/collect-device-log.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/device-diagnostics-remote.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/diagnose-on-device.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/install-device.ps1 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp scripts/install-device.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/
          cp docs/DIAGNOSTICS.md \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/README.md
          chmod 755 \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/collect-device-log.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/device-diagnostics-remote.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/diagnose-on-device.sh \
            dist/stage-diagnostics/remarkable-calendar-notes-diagnostics/install-device.sh

      - name: Package the single all-in-one AppLoad bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # A single published artifact: the AppLoad app, the optional
          # sidebar (qmd + rcc), and the host-side installers/collectors,
          # in one download. Both Vellum recipes source this same zip, and
          # the installer picks the app out of it (sidebar only with
          # --sidebar / -Sidebar).
          combined="dist/stage-combined/remarkable-calendar-notes-${version}"
          mkdir -p "$combined/sidebar"
          cp -a dist/stage/remarkable-calendar-notes "$combined/"
          cp sidebar/3.27/calendarNotesSidebar.qmd "$combined/sidebar/"
          cp dist/build/calendarNotesSidebar.rcc "$combined/sidebar/calendarNotesSidebar.rcc"
          cp sidebar/README.md "$combined/sidebar/README.md"
          cp -a dist/stage-diagnostics/remarkable-calendar-notes-diagnostics "$combined/diagnostics"
          cp docs/INSTALL.md "$combined/INSTALL.md"
          out="dist/remarkable-calendar-notes-${version}.zip"
          (cd dist/stage-combined && zip -r -X "../../$out" "remarkable-calendar-notes-${version}")
          sha256sum "$out" > "$out.sha256"
          sha512sum "$out" > "$out.sha512"

      - uses: actions/upload-artifact@v7
        with:
          name: remarkable-calendar-notes-armv7
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.sha512

  publish-release:
    name: Publish GitHub Release
    needs: build-armv7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: remarkable-calendar-notes-armv7
          path: dist

      - name: Create/update GitHub Release with bundle + checksums
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.sha512
          generate_release_notes: true
          body: |
            Automated reMarkable 2 build. **There is a single file to
            download:**

            - `remarkable-calendar-notes-<ver>.zip` — the app, the optional
              sidebar (qmd + rcc), and the host-side installers and log
              collectors, in one archive. Extract it and run
              `install-device` from the `diagnostics/` folder.
            - `remarkable-calendar-notes-<ver>.zip.sha256` /
              `.zip.sha512` — checksums for the archive (also what the
              Vellum recipes verify).

            The binary is fully static (musl) and launches via a `/bin/sh`
            wrapper that repairs the executable bit, so it installs and runs
            regardless of how the files were copied.

            **Vellum**: this release is not automatically published to
            Vellum. See `scripts/publish-vellum-testing.sh` and
            `docs/DEVELOPMENT.md` for the maintainer-reviewed process to
            propose it to vellum-dev/vellum.
