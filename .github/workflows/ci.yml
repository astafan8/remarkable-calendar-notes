name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo build --release (host)
        run: cargo build --release -p calnotes-app

      - name: Validate host/device helper scripts
        run: |
          sh -n scripts/collect-device-log.sh
          sh -n scripts/device-diagnostics-remote.sh
          sh -n scripts/install-device.sh

      - name: Build the OS 3.27 sidebar icon resource
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev-tools
          /usr/lib/qt5/bin/rcc --binary \
            -o /tmp/calendarNotesSidebar.rcc \
            sidebar/3.27/calendarNotesSidebar.qrc
          test -s /tmp/calendarNotesSidebar.rcc

      - name: Test fake QTFB host
        run: python3 -m unittest scripts/test_qtfb_ci_harness.py

      - name: Launch device mode and capture QTFB screenshot
        run: |
          rm -rf target/qtfb-ci
          install -Dm755 target/release/remarkable-calendar-notes \
            target/qtfb-ci/bundle/remarkable-calendar-notes
          install -Dm644 external.manifest.json \
            target/qtfb-ci/bundle/external.manifest.json
          install -Dm644 assets/icon.png target/qtfb-ci/bundle/icon.png
          python3 scripts/qtfb_ci_harness.py \
            --binary target/qtfb-ci/bundle/remarkable-calendar-notes \
            --manifest target/qtfb-ci/bundle/external.manifest.json \
            --screenshot target/qtfb-ci/calendar-notes.ppm \
            --data-dir target/qtfb-ci/data \
            --process-log target/qtfb-ci/process.log

      - name: Upload QTFB screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtfb-device-mode-screenshot
          if-no-files-found: warn
          path: |
            target/qtfb-ci/calendar-notes.ppm
            target/qtfb-ci/process.log
            target/qtfb-ci/data/calendar-notes.log

  armv7-check:
    name: clippy/check (armv7 — real reMarkable 2 target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install armv7 target and cross C toolchain
        run: |
          rustup target add armv7-unknown-linux-gnueabihf
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabihf \
            libc6-armhf-cross \
            qemu-user

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-armv7-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-armv7-

      - name: cargo clippy --target armv7-unknown-linux-gnueabihf
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: cargo clippy --workspace --target armv7-unknown-linux-gnueabihf -- -D warnings

      - name: Build and launch the ARM release binary through QTFB
        env:
          CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          cargo build --release -p calnotes-app \
            --target armv7-unknown-linux-gnueabihf
          rm -rf target/qtfb-arm-ci
          install -Dm755 \
            target/armv7-unknown-linux-gnueabihf/release/remarkable-calendar-notes \
            target/qtfb-arm-ci/bundle/remarkable-calendar-notes
          install -Dm644 external.manifest.json \
            target/qtfb-arm-ci/bundle/external.manifest.json
          python3 scripts/qtfb_ci_harness.py \
            --binary target/qtfb-arm-ci/bundle/remarkable-calendar-notes \
            --manifest target/qtfb-arm-ci/bundle/external.manifest.json \
            --screenshot target/qtfb-arm-ci/calendar-notes.ppm \
            --data-dir target/qtfb-arm-ci/data \
            --process-log target/qtfb-arm-ci/process.log \
            --emulator /usr/bin/qemu-arm \
            --sysroot /usr/arm-linux-gnueabihf

      - name: Upload ARM QTFB screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qtfb-arm-device-mode-screenshot
          if-no-files-found: warn
          path: |
            target/qtfb-arm-ci/calendar-notes.ppm
            target/qtfb-arm-ci/process.log
            target/qtfb-arm-ci/data/calendar-notes.log
