[package]
name = "calnotes-core"
description = "Platform-independent calendar, ICS/RRULE, ink-notes and rendering logic for remarkable-calendar-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# Serializes tests that mutate the REMARKABLE_CALENDAR_NOTES_DATA_DIR env
# var (which is process-global) so parallel `cargo test` runs don't race.
serial_test = "3"
